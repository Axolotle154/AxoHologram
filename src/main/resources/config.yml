# ---------------------------------------------------------------- #
#                  AxoHologram Configuration File                  #
# ---------------------------------------------------------------- #

general:
  check-updates: true
  view-distance: 48
  visibility-check-interval: 20
  defaults:
    line-spacing: 0.25
    item-line-height: 0.65
    block-line-height: 1.0
    billboard: "center"
    create-default-line: true
    create-default-line-format: "<white><id></white>"
    create-default-item-material: "PAPER"
    create-default-block-material: "STONE"
    display-animation:
      enabled: false
      name: "cinematic_idle"

placeholders:
  refresh-interval: 20

performance:
  visibility-check-interval-ticks: 40
  visibility-move-distance-blocks: 1.5
  dynamic-refresh-interval-ticks: 100
  heavy-placeholder-refresh-interval-ticks: 200
  animation-refresh-interval-ticks: 2
  skip-refresh-when-no-viewers: true
  cache-placeholder-results: true
  placeholder-cache-seconds: 5
  heavy-placeholder-cache-seconds: 10
  static-holograms-never-update: true
  update-only-when-text-changes: true
  low-tps-animation-skip: true
  low-tps-threshold: 17.0

integrations:
  placeholderapi: true
  miniplaceholders: true
  fancynpcs: true
  fancynpcs-sync-interval: 10
  fancynpcs-y-offset: 2.2

importer:
  enabled: true
  backup-before-import: true
  overwrite-existing: false
  import-animations: true
  import-placeholders: true
  auto-detect-installed-plugins: true
